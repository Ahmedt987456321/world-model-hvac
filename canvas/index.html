<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thermal Canvas</title>
<meta name="description" content="A visual world-model canvas for buildings." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
/>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --bg: #e9edf2;
    --panel: #ffffff;
    --panel-2: #f3f6fa;
    --node: #ffffff;
    --node-head: #eef2f7;
    --ink: #14202b;
    --ink-dim: #58697a;
    --ink-faint: #8496a6;
    --line: #d0d9e2;
    --line-strong: #b7c3ce;
    --grid: #dde4ec;
    --accent: #0c8391;
    --accent-hi: #0aa2b3;
    --accent-soft: rgba(12, 131, 145, 0.12);
    --cold: #3f74d6;
    --warm: #e07a3c;
    --good: #2f9e6b;
    --danger: #d0533f;
    --shadow: 0 1px 2px rgba(20, 32, 43, 0.06), 0 8px 24px rgba(20, 32, 43, 0.08);
    --shadow-lift: 0 2px 6px rgba(20, 32, 43, 0.12), 0 16px 40px rgba(20, 32, 43, 0.16);
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c131b;
      --panel: #131d27;
      --panel-2: #17222e;
      --node: #172431;
      --node-head: #1e2d3b;
      --ink: #e7eef5;
      --ink-dim: #92a3b4;
      --ink-faint: #6a7d8f;
      --line: #263644;
      --line-strong: #33475a;
      --grid: #1c2a37;
      --accent: #2fbccb;
      --accent-hi: #54d6e3;
      --accent-soft: rgba(47, 188, 203, 0.15);
      --cold: #6f9bff;
      --warm: #f2954f;
      --good: #45c98a;
      --danger: #ec6a54;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
      --shadow-lift: 0 2px 6px rgba(0, 0, 0, 0.5), 0 20px 50px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c131b;
    --panel: #131d27;
    --panel-2: #17222e;
    --node: #172431;
    --node-head: #1e2d3b;
    --ink: #e7eef5;
    --ink-dim: #92a3b4;
    --ink-faint: #6a7d8f;
    --line: #263644;
    --line-strong: #33475a;
    --grid: #1c2a37;
    --accent: #2fbccb;
    --accent-hi: #54d6e3;
    --accent-soft: rgba(47, 188, 203, 0.15);
    --cold: #6f9bff;
    --warm: #f2954f;
    --good: #45c98a;
    --danger: #ec6a54;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, 0.5), 0 20px 50px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    height: 100dvh;
  }

  /* ---- header ---- */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .clock {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  .clock .now { color: var(--ink); font-weight: 500; }
  .clock .temp { font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }
  button:hover { border-color: var(--line-strong); background: var(--node-head); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    min-width: 92px;
  }
  button.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--panel-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ---- workspace ---- */
  .work { display: flex; min-height: 0; overflow: hidden; }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: auto;
    background:
      radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 22px 22px;
    background-color: var(--bg);
  }
  .content { position: relative; width: 1400px; height: 900px; }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wire { fill: none; stroke: var(--line-strong); stroke-width: 2.5; }
  .wire.live { stroke: var(--accent); }
  .wire-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .wire.flow { stroke: var(--accent); stroke-dasharray: 5 7; animation: flow 0.7s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .wire-temp { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 4 4; opacity: 0.8; }

  /* palette */
  .palette {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 30;
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    max-width: calc(100% - 24px);
  }
  .palette .lbl { font-size: 11px; color: var(--ink-faint); align-self: center; padding: 0 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .palette button { font-size: 12px; padding: 5px 9px; }

  .hint {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 20;
    font-size: 11px;
    color: var(--ink-faint);
    font-family: var(--mono);
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    padding: 5px 8px;
    border-radius: 6px;
    pointer-events: none;
  }

  /* nodes */
  .node {
    position: absolute;
    width: 208px;
    background: var(--node);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    user-select: none;
    transition: box-shadow 0.12s, border-color 0.12s;
  }
  .node.sel { border-color: var(--accent); box-shadow: var(--shadow-lift); }
  .node .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--node-head);
    border-radius: 11px 11px 0 0;
    cursor: grab;
    border-bottom: 1px solid var(--line);
  }
  .node.dragging .head { cursor: grabbing; }
  .node .glyph {
    width: 22px; height: 22px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .node .glyph svg { width: 14px; height: 14px; }
  .node .name { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
  .node .kind { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-left: auto; text-transform: uppercase; letter-spacing: 0.05em; }

  .node .body { padding: 10px 12px 12px; }
  .readout {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .readout .big { font-size: 26px; font-weight: 600; line-height: 1; }
  .readout .unit { font-size: 12px; color: var(--ink-dim); }
  .readout .sub { font-size: 11px; color: var(--ink-dim); margin-left: auto; }

  /* ports */
  .port {
    position: absolute;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--line-strong);
    cursor: crosshair;
    z-index: 5;
    transition: border-color 0.1s, background 0.1s, transform 0.1s;
  }
  .port:hover, .port.hot { border-color: var(--accent); background: var(--accent); transform: scale(1.25); }
  .port.out { right: -7px; }
  .port.in { left: -7px; }
  .port .plabel {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--accent);
    background: var(--node);
    padding: 0 3px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .port:hover .plabel { opacity: 1; }
  .content.wiring .port.in .plabel { opacity: 1; }
  .port.out .plabel { right: 18px; text-align: right; }
  .port.in .plabel { left: 18px; }

  /* ---- inspector ---- */
  aside {
    width: 288px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); margin: 0 0 12px; font-weight: 600; }
  .insp-title { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .insp-title .name { font-size: 16px; font-weight: 600; }
  .insp-desc { font-size: 12.5px; color: var(--ink-dim); margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
  .field label .val { font-family: var(--mono); color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .mode-toggle { display: flex; gap: 6px; }
  .mode-toggle button { flex: 1; }
  .mode-toggle button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .empty-insp { color: var(--ink-faint); font-size: 13px; font-style: italic; }
  .danger-btn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); width: 100%; margin-top: 8px; }
  .danger-btn:hover { background: color-mix(in srgb, var(--danger) 12%, var(--panel-2)); border-color: var(--danger); }

  /* ---- chart dock ---- */
  .dock {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 16px 14px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 18px;
    align-items: stretch;
  }
  .chart-wrap { min-width: 0; }
  .chart-top { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
  .chart-top h2 { margin: 0; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  canvas.chart { width: 100%; height: 168px; display: block; }
  .scrub { width: 100%; margin-top: 6px; accent-color: var(--accent); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .stat {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
  .stat .v { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v small { font-size: 12px; color: var(--ink-dim); font-weight: 500; }
  .stat.wide { grid-column: 1 / -1; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: var(--mono); }

  @media (max-width: 860px) {
    .work { flex-direction: column; overflow: visible; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--line); max-height: 240px; }
    .stage { min-height: 340px; }
    .dock { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Thermal Canvas</h1>
      <span class="tag">world-model · buildings</span>
    </div>
    <div class="clock" aria-live="off">
      <span>day clock</span>
      <span class="now" id="clockTime">00:00</span>
      <span class="temp" id="clockTemp">—</span>
    </div>
    <div class="controls">
      <div class="seg" id="hoursSeg" role="group" aria-label="Simulation length">
        <button data-hours="12">12h</button>
        <button data-hours="24" class="on">24h</button>
        <button data-hours="48">48h</button>
      </div>
      <button id="resetBtn" title="Restore the one-room world">Reset world</button>
      <button id="playBtn" class="primary">▶ Play</button>
    </div>
  </header>

  <div class="work">
    <div class="stage" id="stage">
      <div class="content" id="content">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <!-- nodes injected here -->
      </div>
      <div class="palette">
        <span class="lbl">Add</span>
        <button data-add="weather">＋ Weather</button>
        <button data-add="occupancy">＋ Occupancy</button>
        <button data-add="ahu">＋ Air handler</button>
        <button data-add="room">＋ Room</button>
      </div>
      <div class="hint">drag a node header to move · drag an output ● to an input ● to wire · click a wire to cut</div>
    </div>

    <aside id="inspector">
      <h2>Inspector</h2>
      <div id="inspBody"><p class="empty-insp">Select a component to edit its physics.</p></div>
    </aside>
  </div>

  <div class="dock">
    <div class="chart-wrap">
      <div class="chart-top">
        <h2>Room temperature over time</h2>
        <div class="legend">
          <span><i style="background:var(--good)"></i>Room</span>
          <span><i style="background:var(--cold)"></i>Outdoor</span>
          <span><i style="background:var(--warm)"></i>Supply air</span>
          <span><i style="background:var(--accent-soft);border:1px solid var(--good)"></i>Comfort 20–24°C</span>
        </div>
      </div>
      <canvas class="chart" id="chart"></canvas>
      <input type="range" class="scrub" id="scrub" min="0" max="100" value="100" aria-label="Time" />
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   PHYSICS ENGINE  — a direct port of the Python wm/ package.
   Single-zone RC room driven by envelope, supply air, internal & solar gains.
   All SI: °C, W, s, J.  Integrated with classical RK4.
   ========================================================================= */
const CP_AIR = 1005;
const HOUR = 3600, DAY = 86400;
const hourOfDay = (t) => (((t % DAY) + DAY) % DAY) / HOUR;

/* Each node type: its ports, default params, editable-param metadata,
   and the pure functions that compute algebraic outputs and state derivatives.
   `bus` maps "nodeId.port" -> value.  A component addresses its own inputs as
   `${id}.${port}`, exactly like the Python engine. */
const TYPES = {
  weather: {
    label: "Weather", kind: "source",
    glyph: '<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4M12 8a4 4 0 100 8 4 4 0 000-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    inputs: [], outputs: ["T_out", "irradiance"],
    params: { t_mean: 12, t_swing: 7, t_peak_hour: 15, solar_peak: 600, sunrise: 6, sunset: 19 },
    meta: [
      { k: "t_mean", label: "Mean outdoor", unit: "°C", min: -10, max: 35, step: 0.5 },
      { k: "t_swing", label: "Day/night swing", unit: "±°C", min: 0, max: 18, step: 0.5 },
      { k: "solar_peak", label: "Peak solar", unit: "W/m²", min: 0, max: 1000, step: 20 },
    ],
    outputs_fn(id, t, bus, p) {
      const h = hourOfDay(t);
      const phase = 2 * Math.PI * (h - p.t_peak_hour) / 24;
      const T_out = p.t_mean + p.t_swing * Math.cos(phase);
      let irr = 0;
      if (h > p.sunrise && h < p.sunset) {
        const frac = (h - p.sunrise) / (p.sunset - p.sunrise);
        irr = p.solar_peak * Math.sin(Math.PI * frac);
      }
      return { T_out, irradiance: irr };
    },
    readout(id, bus) {
      return { big: fmt(bus[id + ".T_out"], 1), unit: "°C", sub: "☀ " + fmt(bus[id + ".irradiance"], 0) + " W/m²", color: tempColor(bus[id + ".T_out"]) };
    },
  },

  occupancy: {
    label: "Occupancy", kind: "source",
    glyph: '<path d="M9 11a3 3 0 100-6 3 3 0 000 6zM4 20v-1a5 5 0 015-5 5 5 0 015 5v1M17 11a3 3 0 100-6M20 20v-1a5 5 0 00-3-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    inputs: [], outputs: ["Q_int"],
    params: { n_people: 4, gain_per_person: 100, arrive: 9, leave: 17 },
    meta: [
      { k: "n_people", label: "People", unit: "", min: 0, max: 20, step: 1 },
      { k: "gain_per_person", label: "Heat / person", unit: "W", min: 60, max: 150, step: 5 },
      { k: "arrive", label: "Arrive", unit: "h", min: 0, max: 23, step: 1 },
      { k: "leave", label: "Leave", unit: "h", min: 1, max: 24, step: 1 },
    ],
    outputs_fn(id, t, bus, p) {
      const h = hourOfDay(t);
      const present = h >= p.arrive && h < p.leave;
      const n = present ? p.n_people : 0;
      return { n, Q_int: n * p.gain_per_person };
    },
    readout(id, bus) {
      const n = bus[id + ".n"] ?? 0;
      return { big: fmt(n, 0), unit: n === 1 ? "person" : "people", sub: fmt((bus[id + ".Q_int"] || 0), 0) + " W", color: n > 0 ? "var(--warm)" : "var(--ink-faint)" };
    },
  },

  ahu: {
    label: "Air handler", kind: "equipment",
    glyph: '<path d="M4 6h16v12H4zM8 12a4 4 0 108 0 4 4 0 00-8 0zM12 12l2.5-1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    inputs: ["T_room"], outputs: ["T_supply", "Q_hvac"],
    params: { mode: 1, m_dot: 0.10, supply_setpoint: 16, room_setpoint: 22, kp: 2, supply_min: 12, supply_max: 40 },
    meta: [
      { k: "mode", label: "Control", unit: "", mode: true },
      { k: "room_setpoint", label: "Room setpoint", unit: "°C", min: 16, max: 28, step: 0.5, showIf: "mode" },
      { k: "supply_setpoint", label: "Fixed supply", unit: "°C", min: 10, max: 40, step: 0.5, showIfNot: "mode" },
      { k: "m_dot", label: "Air flow", unit: "kg/s", min: 0.01, max: 0.4, step: 0.01 },
      { k: "kp", label: "Gain (P)", unit: "", min: 0.5, max: 6, step: 0.25, showIf: "mode" },
    ],
    outputs_fn(id, t, bus, p) {
      const T_room = bus[id + ".T_room"] ?? p.room_setpoint;
      let T_supply;
      if (p.mode) { // thermostat (proportional)
        const err = p.room_setpoint - T_room;
        T_supply = p.room_setpoint + p.kp * err;
        T_supply = Math.max(p.supply_min, Math.min(p.supply_max, T_supply));
      } else {
        T_supply = p.supply_setpoint;
      }
      const Q_hvac = p.m_dot * CP_AIR * (T_supply - T_room);
      return { T_supply, Q_hvac };
    },
    readout(id, bus) {
      const q = (bus[id + ".Q_hvac"] || 0) / 1000;
      const mode = q >= 0 ? "heating" : "cooling";
      return { big: fmt(bus[id + ".T_supply"], 1), unit: "°C supply", sub: (q >= 0 ? "+" : "") + fmt(q, 2) + " kW " + mode, color: tempColor(bus[id + ".T_supply"]) };
    },
  },

  room: {
    label: "Room", kind: "zone",
    glyph: '<path d="M4 20V9l8-5 8 5v11M4 20h16M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    inputs: ["T_out", "Q_hvac", "Q_int", "solar"], outputs: ["T", "Q_env", "Q_solar", "Q_total"],
    state: { T: 21 },
    params: { C: 3.0e5, UA: 30, solar_aperture: 0.5 },
    meta: [
      { k: "UA", label: "Envelope loss", unit: "W/K", min: 5, max: 120, step: 1 },
      { k: "C", label: "Thermal mass", unit: "kJ/K", min: 5e4, max: 1.2e6, step: 1e4, scale: 1e-3 },
      { k: "solar_aperture", label: "Solar aperture", unit: "m²", min: 0, max: 4, step: 0.1 },
    ],
    outputs_fn(id, t, bus, p, state) {
      const T = state.T;
      const T_out = bus[id + ".T_out"] ?? T;
      const Q_env = p.UA * (T_out - T);
      const Q_hvac = bus[id + ".Q_hvac"] ?? 0;
      const Q_int = bus[id + ".Q_int"] ?? 0;
      const irr = bus[id + ".solar"] ?? 0;
      const Q_solar = p.solar_aperture * irr;
      return { Q_env, Q_solar, Q_total: Q_env + Q_hvac + Q_int + Q_solar };
    },
    deriv_fn(id, t, bus, p) {
      return { T: (bus[id + ".Q_total"] ?? 0) / p.C };
    },
    readout(id, bus) {
      return { big: fmt(bus[id + ".T"], 1), unit: "°C", sub: "", color: tempColor(bus[id + ".T"]), emphasize: true };
    },
  },
};

/* ---- the graph: nodes + connections ---- */
let graph = { nodes: [], conns: [], seq: 0 };

function defaultGraph() {
  const g = { nodes: [], conns: [], seq: 0 };
  const mk = (type, x, y) => {
    const t = TYPES[type];
    const id = type + "_" + (g.seq++);
    return {
      id, type, x, y,
      params: { ...t.params },
      state: t.state ? { ...t.state } : null,
    };
  };
  g.nodes.push(mk("weather", 40, 64));
  g.nodes.push(mk("occupancy", 40, 232));
  g.nodes.push(mk("ahu", 40, 388));
  g.nodes.push(mk("room", 486, 196));
  const w = g.nodes[0].id, o = g.nodes[1].id, a = g.nodes[2].id, r = g.nodes[3].id;
  g.conns.push({ from: w, fromPort: "T_out", to: r, toPort: "T_out" });
  g.conns.push({ from: w, fromPort: "irradiance", to: r, toPort: "solar" });
  g.conns.push({ from: o, fromPort: "Q_int", to: r, toPort: "Q_int" });
  g.conns.push({ from: a, fromPort: "Q_hvac", to: r, toPort: "Q_hvac" });
  g.conns.push({ from: r, fromPort: "T", to: a, toPort: "T_room" });
  return g;
}

/* Build the signal bus at time t for a given state snapshot.
   States are published first; then outputs are evaluated over a few passes so
   the result is independent of node order for acyclic algebraic links. */
function buildBus(g, t, stateVec) {
  const bus = {};
  // scatter the flat state vector back onto nodes and publish states
  let i = 0;
  for (const n of g.nodes) {
    if (!n.state) continue;
    for (const sv of Object.keys(n.state)) {
      const v = stateVec[i++];
      n._liveState = n._liveState || {};
      n._liveState[sv] = v;
      bus[n.id + "." + sv] = v;
    }
  }
  for (let pass = 0; pass < 3; pass++) {
    for (const c of g.conns) {
      const k = c.from + "." + c.fromPort;
      if (k in bus) bus[c.to + "." + c.toPort] = bus[k];
    }
    for (const n of g.nodes) {
      const T = TYPES[n.type];
      if (!T.outputs_fn) continue;
      const out = T.outputs_fn(n.id, t, bus, n.params, n._liveState || n.state || {});
      for (const port in out) bus[n.id + "." + port] = out[port];
    }
  }
  return bus;
}

function stateIndex(g) {
  const idx = [];
  for (const n of g.nodes) if (n.state) for (const sv of Object.keys(n.state)) idx.push([n, sv]);
  return idx;
}
function getStateVec(g) { return stateIndex(g).map(([n, sv]) => n.state[sv]); }
function setStateVec(g, x) { stateIndex(g).forEach(([n, sv], i) => (n.state[sv] = x[i])); }

function derivVec(g, t, x) {
  const bus = buildBus(g, t, x);
  const d = [];
  for (const n of g.nodes) {
    if (!n.state) continue;
    const T = TYPES[n.type];
    const dd = T.deriv_fn ? T.deriv_fn(n.id, t, bus, n.params) : {};
    for (const sv of Object.keys(n.state)) d.push(dd[sv] ?? 0);
  }
  return d;
}

function run(g, hours, dt = 60) {
  // fresh integration state
  for (const n of g.nodes) if (n.state) n.state = { ...(TYPES[n.type].state) , ...resetState(n) };
  const trace = { t: [], bus: [] };
  let t = 0;
  const rec = () => {
    const bus = buildBus(g, t, getStateVec(g));
    trace.t.push(t); trace.bus.push(bus);
  };
  rec();
  const steps = Math.round((hours * HOUR) / dt);
  const add = (a, b, s) => a.map((ai, i) => ai + s * b[i]);
  for (let s = 0; s < steps; s++) {
    const x0 = getStateVec(g);
    const k1 = derivVec(g, t, x0);
    const k2 = derivVec(g, t + dt / 2, add(x0, k1, dt / 2));
    const k3 = derivVec(g, t + dt / 2, add(x0, k2, dt / 2));
    const k4 = derivVec(g, t + dt, add(x0, k3, dt));
    const x1 = x0.map((xi, i) => xi + (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    setStateVec(g, x1);
    t += dt;
    rec();
  }
  return trace;
}
// initial temperature for a room = its declared default state (editable later)
function resetState(n) { return n._initState ? { ...n._initState } : {}; }

/* ---- run summary ---- */
function summarise(trace, band = [20, 24]) {
  const room = pickSignal(trace, "room", "T");
  const supply = pickSignal(trace, "ahu", "Q_hvac");
  if (!room) return null;
  const T = room.vals;
  const inBand = T.filter((x) => x >= band[0] && x <= band[1]).length;
  let energyJ = 0;
  if (supply) {
    const q = supply.vals.map(Math.abs);
    for (let i = 1; i < trace.t.length; i++) energyJ += 0.5 * (q[i] + q[i - 1]) * (trace.t[i] - trace.t[i - 1]);
  }
  return {
    tMin: Math.min(...T), tMax: Math.max(...T), tEnd: T[T.length - 1],
    comfort: inBand / T.length,
    energy: energyJ / 3.6e6,
    peak: supply ? Math.max(...supply.vals.map(Math.abs)) / 1000 : 0,
    hours: (trace.t[trace.t.length - 1] - trace.t[0]) / HOUR,
  };
}
// find first node of a type and read one of its ports across the trace
function pickSignal(trace, type, port) {
  const id = graph.nodes.find((n) => n.type === type)?.id;
  if (!id) return null;
  const key = id + "." + port;
  if (!(key in trace.bus[0])) return null;
  return { key, vals: trace.bus.map((b) => b[key] ?? 0) };
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function fmt(x, d = 1) { return (x == null || Number.isNaN(x)) ? "—" : x.toFixed(d); }
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// map a temperature to a cold→comfortable→warm colour (theme-independent hues)
function tempColor(T) {
  if (T == null || Number.isNaN(T)) return "var(--ink-faint)";
  const stops = [
    [10, [63, 116, 214]],   // cold blue
    [20, [47, 158, 107]],   // comfortable green
    [24, [47, 158, 107]],
    [30, [224, 122, 60]],   // warm orange
  ];
  T = Math.max(stops[0][0], Math.min(stops[stops.length - 1][0], T));
  for (let i = 1; i < stops.length; i++) {
    if (T <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      const f = (T - t0) / (t1 - t0 || 1);
      const c = c0.map((v, j) => Math.round(v + f * (c1[j] - v)));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return "rgb(224,122,60)";
}

/* =========================================================================
   STATE
   ========================================================================= */
let trace = null;
let hours = 24;
let playhead = 0;      // index into trace
let playing = false;
let selectedId = null;
let rafId = null;

const stage = document.getElementById("stage");
const content = document.getElementById("content");
const wiresSvg = document.getElementById("wires");
const inspBody = document.getElementById("inspBody");
const chart = document.getElementById("chart");
const scrub = document.getElementById("scrub");
const statsEl = document.getElementById("stats");
const nodeEls = new Map(); // id -> {el, portEls:Map}

/* =========================================================================
   RENDER: nodes & wires
   ========================================================================= */
function rebuild() {
  // remove old node DOM
  for (const { el } of nodeEls.values()) el.remove();
  nodeEls.clear();
  for (const n of graph.nodes) createNodeEl(n);
  layoutWires();
  refreshReadouts();
}

function createNodeEl(n) {
  const T = TYPES[n.type];
  const el = document.createElement("div");
  el.className = "node";
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  el.dataset.id = n.id;
  el.innerHTML = `
    <div class="head">
      <span class="glyph"><svg viewBox="0 0 24 24">${T.glyph}</svg></span>
      <span class="name">${T.label}</span>
      <span class="kind">${T.kind}</span>
    </div>
    <div class="body"><div class="readout"></div></div>`;
  content.appendChild(el);

  const portEls = new Map();
  const ins = T.inputs;
  const shownOuts = T.outputs.filter((p) => ["T_out", "irradiance", "Q_int", "T_supply", "Q_hvac", "T"].includes(p));
  // ensure the box is tall enough for its ports
  const maxPorts = Math.max(ins.length, shownOuts.length);
  el.style.minHeight = (42 + 14 + maxPorts * 26 + 6) + "px";
  // input ports on the left, output ports on the right
  ins.forEach((p, i) => portEls.set("in:" + p, addPort(el, n, "in", p, i, ins.length)));
  shownOuts.forEach((p, i) => portEls.set("out:" + p, addPort(el, n, "out", p, i, shownOuts.length)));

  nodeEls.set(n.id, { el, portEls });

  // drag by header
  const head = el.querySelector(".head");
  head.addEventListener("pointerdown", (e) => startNodeDrag(e, n, el));
  el.addEventListener("pointerdown", () => select(n.id));
}

function addPort(nodeEl, n, dir, port, i, total) {
  const p = document.createElement("div");
  p.className = "port " + dir;
  const bodyTop = 42; // header height-ish
  const spacing = 26;
  const y = bodyTop + 14 + i * spacing;
  p.style.top = y + "px";
  p.dataset.node = n.id; p.dataset.port = port; p.dataset.dir = dir;
  p.innerHTML = `<span class="plabel">${port}</span>`;
  nodeEl.appendChild(p);
  if (dir === "out") p.addEventListener("pointerdown", (e) => startWire(e, n.id, port));
  return p;
}

function portCenter(nodeId, dir, port) {
  const rec = nodeEls.get(nodeId);
  if (!rec) return null;
  const p = rec.portEls.get(dir + ":" + port);
  if (!p) return null;
  const n = graph.nodes.find((x) => x.id === nodeId);
  return { x: n.x + p.offsetLeft + p.offsetWidth / 2, y: n.y + p.offsetTop + p.offsetHeight / 2 };
}

function wirePath(a, b) {
  const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5);
  return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
}

function layoutWires() {
  wiresSvg.innerHTML = "";
  graph.conns.forEach((c, idx) => {
    const a = portCenter(c.from, "out", c.fromPort);
    const b = portCenter(c.to, "in", c.toPort);
    if (!a || !b) return;
    const d = wirePath(a, b);
    const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hit.setAttribute("d", d); hit.setAttribute("class", "wire-hit");
    hit.addEventListener("pointerdown", (e) => { e.stopPropagation(); cutWire(idx); });
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "wire" + (playing ? " flow live" : ""));
    wiresSvg.appendChild(hit); wiresSvg.appendChild(path);
  });
}

function cutWire(idx) { graph.conns.splice(idx, 1); recompute(); layoutWires(); }

/* =========================================================================
   INTERACTION: node drag & wiring
   ========================================================================= */
function startNodeDrag(e, n, el) {
  e.preventDefault();
  select(n.id);
  el.classList.add("dragging");
  el.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
  const move = (ev) => {
    n.x = Math.max(0, ox + (ev.clientX - sx));
    n.y = Math.max(0, oy + (ev.clientY - sy));
    el.style.left = n.x + "px"; el.style.top = n.y + "px";
    layoutWires();
  };
  const up = (ev) => {
    el.classList.remove("dragging");
    el.releasePointerCapture(e.pointerId);
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", up);
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", up);
}

let wiring = null;
function startWire(e, fromId, fromPort) {
  e.preventDefault(); e.stopPropagation();
  const a = portCenter(fromId, "out", fromPort);
  const temp = document.createElementNS("http://www.w3.org/2000/svg", "path");
  temp.setAttribute("class", "wire-temp");
  wiresSvg.appendChild(temp);
  wiring = { fromId, fromPort, temp, a };
  window.addEventListener("pointermove", moveWire);
  window.addEventListener("pointerup", endWire);
  content.classList.add("wiring");
}
function stageToContent(clientX, clientY) {
  const r = content.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}
function moveWire(e) {
  if (!wiring) return;
  const b = stageToContent(e.clientX, e.clientY);
  wiring.temp.setAttribute("d", wirePath(wiring.a, b));
  const port = e.target.closest?.(".port.in");
  document.querySelectorAll(".port.hot").forEach((p) => p.classList.remove("hot"));
  if (port) port.classList.add("hot");
}
function endWire(e) {
  window.removeEventListener("pointermove", moveWire);
  window.removeEventListener("pointerup", endWire);
  content.classList.remove("wiring");
  document.querySelectorAll(".port.hot").forEach((p) => p.classList.remove("hot"));
  const port = e.target.closest?.(".port.in");
  if (port && wiring) {
    const toId = port.dataset.node, toPort = port.dataset.port;
    if (toId !== wiring.fromId) {
      // one source per input: drop any existing wire into this input
      graph.conns = graph.conns.filter((c) => !(c.to === toId && c.toPort === toPort));
      graph.conns.push({ from: wiring.fromId, fromPort: wiring.fromPort, to: toId, toPort });
      recompute();
    }
  }
  wiring?.temp.remove();
  wiring = null;
  layoutWires();
}

/* =========================================================================
   SELECTION & INSPECTOR
   ========================================================================= */
function select(id) {
  selectedId = id;
  for (const [nid, { el }] of nodeEls) el.classList.toggle("sel", nid === id);
  renderInspector();
}

function renderInspector() {
  const n = graph.nodes.find((x) => x.id === selectedId);
  if (!n) { inspBody.innerHTML = '<p class="empty-insp">Select a component to edit its physics.</p>'; return; }
  const T = TYPES[n.type];
  let html = `<div class="insp-title">
      <span class="glyph" style="background:var(--accent-soft);color:var(--accent);width:24px;height:24px;border-radius:6px;display:grid;place-items:center">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px">${T.glyph}</svg></span>
      <span class="name">${T.label}</span></div>
    <p class="insp-desc">${describe(n.type)}</p>`;

  for (const m of T.meta) {
    if (m.showIf && !n.params[m.showIf]) continue;
    if (m.showIfNot && n.params[m.showIfNot]) continue;
    if (m.mode) {
      html += `<div class="field"><label>${m.label}</label>
        <div class="mode-toggle" data-mode="${n.id}">
          <button data-m="1" class="${n.params.mode ? "on" : ""}">Thermostat</button>
          <button data-m="0" class="${!n.params.mode ? "on" : ""}">Fixed supply</button>
        </div></div>`;
      continue;
    }
    const scale = m.scale || 1;
    const shown = (n.params[m.k] * scale);
    html += `<div class="field">
      <label>${m.label}<span class="val" data-valfor="${m.k}">${trimNum(shown)} ${m.unit}</span></label>
      <input type="range" id="rng_${m.k}" data-key="${m.k}" data-scale="${scale}"
             min="${m.min * scale}" max="${m.max * scale}" step="${m.step * scale}" value="${shown}" />
    </div>`;
  }
  html += `<button class="danger-btn" id="delNode">Delete component</button>`;
  inspBody.innerHTML = html;

  inspBody.querySelectorAll('input[type="range"]').forEach((r) => {
    r.addEventListener("input", () => {
      const key = r.dataset.key, scale = parseFloat(r.dataset.scale);
      n.params[key] = parseFloat(r.value) / scale;
      inspBody.querySelector(`[data-valfor="${key}"]`).textContent = trimNum(parseFloat(r.value)) + " " + (T.meta.find((mm) => mm.k === key).unit);
      recompute();
    });
  });
  const modeBox = inspBody.querySelector(".mode-toggle");
  if (modeBox) modeBox.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    n.params.mode = parseInt(b.dataset.m, 10);
    renderInspector(); recompute();
  }));
  inspBody.querySelector("#delNode").addEventListener("click", () => deleteNode(n.id));
}
function trimNum(x) { return Number.isInteger(x) ? String(x) : (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(2).replace(/\.?0+$/, "")); }
function describe(type) {
  return {
    weather: "Outdoor air and sun as a daily cycle. Drives the room through the envelope.",
    occupancy: "People on a schedule; each adds sensible heat while present.",
    ahu: "Delivers conditioned air. Thermostat modulates supply temperature toward the setpoint; fixed holds a constant supply.",
    room: "A single thermal zone. Its temperature is the one state integrated over time: C·dT/dt = ΣQ.",
  }[type];
}

function deleteNode(id) {
  graph.nodes = graph.nodes.filter((n) => n.id !== id);
  graph.conns = graph.conns.filter((c) => c.from !== id && c.to !== id);
  if (selectedId === id) selectedId = null;
  rebuild(); recompute(); renderInspector();
}

function addNode(type) {
  const T = TYPES[type];
  const id = type + "_" + (graph.seq++);
  const x = stage.scrollLeft + 120 + Math.random() * 60;
  const y = stage.scrollTop + 80 + Math.random() * 60;
  const n = { id, type, x, y, params: { ...T.params }, state: T.state ? { ...T.state } : null };
  graph.nodes.push(n);
  createNodeEl(n); layoutWires(); select(id); recompute();
}

/* =========================================================================
   SIMULATION + CHART
   ========================================================================= */
function recompute() {
  // remember each stateful node's editable initial temperature as its start
  for (const n of graph.nodes) if (n.state) n._initState = n._initState || { ...n.state };
  trace = run(graph, hours, 60);
  scrub.max = trace.t.length - 1;
  if (playhead > trace.t.length - 1) playhead = trace.t.length - 1;
  drawChart();
  updateStats();
  refreshReadouts();
}

function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = chart.clientWidth, h = chart.clientHeight;
  chart.width = w * dpr; chart.height = h * dpr;
  const ctx = chart.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!trace) return;

  const room = pickSignal(trace, "room", "T");
  const out = pickSignal(trace, "weather", "T_out");
  const sup = pickSignal(trace, "ahu", "T_supply");
  const series = [room, out, sup].filter(Boolean);
  if (!series.length) return;

  const padL = 34, padR = 8, padT = 10, padB = 20;
  const x0 = padL, x1 = w - padR, y0 = padT, y1 = h - padB;
  let lo = Infinity, hi = -Infinity;
  for (const s of series) for (const v of s.vals) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  lo = Math.min(lo, 18); hi = Math.max(hi, 26);
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  const tMax = trace.t[trace.t.length - 1];
  const X = (t) => x0 + (t / tMax) * (x1 - x0);
  const Y = (v) => y1 - ((v - lo) / (hi - lo)) * (y1 - y0);

  const ink = cssVar("--ink"), dim = cssVar("--ink-faint"), grid = cssVar("--grid");
  ctx.font = '11px "IBM Plex Mono", monospace';

  // comfort band
  ctx.fillStyle = cssVar("--accent-soft");
  ctx.fillRect(x0, Y(24), x1 - x0, Y(20) - Y(24));

  // y grid + labels
  ctx.strokeStyle = grid; ctx.fillStyle = dim; ctx.lineWidth = 1;
  const yStep = (hi - lo) <= 12 ? 2 : 5;
  for (let v = Math.ceil(lo / yStep) * yStep; v <= hi; v += yStep) {
    ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke();
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(v + "°", x0 - 6, Y(v));
  }
  // x labels (every 6h)
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let hh = 0; hh <= hours; hh += 6) {
    const t = hh * HOUR;
    ctx.fillText(hh + "h", X(t), y1 + 5);
  }

  const drawLine = (s, color, wgt, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = wgt; ctx.setLineDash(dash || []);
    ctx.beginPath();
    s.vals.forEach((v, i) => { const x = X(trace.t[i]), y = Y(v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.setLineDash([]);
  };
  if (out) drawLine(out, cssVar("--cold"), 1.5);
  if (sup) drawLine(sup, cssVar("--warm"), 1.5, [4, 3]);
  if (room) drawLine(room, cssVar("--good"), 2.5);

  // playhead cursor
  const t = trace.t[playhead];
  ctx.strokeStyle = ink; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(t), y0); ctx.lineTo(X(t), y1); ctx.stroke();
  ctx.globalAlpha = 1;
  if (room) {
    const v = room.vals[playhead];
    ctx.fillStyle = tempColor(v);
    ctx.beginPath(); ctx.arc(X(t), Y(v), 4, 0, 2 * Math.PI); ctx.fill();
  }
}

function updateStats() {
  const s = summarise(trace);
  if (!s) { statsEl.innerHTML = '<div class="stat wide"><div class="k">No room in the world</div><div class="v">—</div></div>'; return; }
  const comfPct = Math.round(s.comfort * 100);
  const comfColor = comfPct >= 80 ? "var(--good)" : comfPct >= 50 ? "var(--warm)" : "var(--danger)";
  statsEl.innerHTML = `
    <div class="stat"><div class="k">Comfort</div><div class="v" style="color:${comfColor}">${comfPct}<small>%</small></div></div>
    <div class="stat"><div class="k">HVAC energy</div><div class="v">${fmt(s.energy, 2)}<small> kWh</small></div></div>
    <div class="stat"><div class="k">Peak power</div><div class="v">${fmt(s.peak, 2)}<small> kW</small></div></div>
    <div class="stat"><div class="k">Range</div><div class="v">${fmt(s.tMin, 1)}–${fmt(s.tMax, 1)}<small>°C</small></div></div>`;
}

/* live node readouts + clock at the current playhead */
function refreshReadouts() {
  if (!trace) return;
  const bus = trace.bus[playhead];
  for (const n of graph.nodes) {
    const rec = nodeEls.get(n.id); if (!rec) continue;
    const r = TYPES[n.type].readout(n.id, bus);
    const box = rec.el.querySelector(".readout");
    box.innerHTML = `<span class="big" style="color:${r.color}">${r.big}</span><span class="unit">${r.unit}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ""}`;
    if (r.emphasize) box.querySelector(".big").style.fontSize = "30px";
  }
  const t = trace.t[playhead];
  const hh = Math.floor(hourOfDay(t)), mm = Math.floor((hourOfDay(t) - hh) * 60);
  document.getElementById("clockTime").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  const roomT = pickSignal(trace, "room", "T");
  const tv = roomT ? roomT.vals[playhead] : null;
  const tEl = document.getElementById("clockTemp");
  tEl.textContent = tv == null ? "—" : fmt(tv, 1) + "°C";
  tEl.style.color = tempColor(tv);
  scrub.value = playhead;
}

/* =========================================================================
   PLAYBACK
   ========================================================================= */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function play() {
  if (!trace) return;
  if (playhead >= trace.t.length - 1) playhead = 0;
  playing = true;
  document.getElementById("playBtn").innerHTML = "❚❚ Pause";
  layoutWires();
  const durationMs = reduceMotion ? 0 : 7000;
  const startIdx = playhead;
  const total = trace.t.length - 1;
  const t0 = performance.now();
  const tick = (now) => {
    if (!playing) return;
    const frac = durationMs ? Math.min(1, (now - t0) / durationMs) : 1;
    playhead = Math.round(startIdx + frac * (total - startIdx));
    drawChart(); refreshReadouts();
    if (frac >= 1) { stopPlay(); return; }
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}
function stopPlay() {
  playing = false;
  cancelAnimationFrame(rafId);
  document.getElementById("playBtn").innerHTML = "▶ Play";
  layoutWires();
  drawChart();
}
function togglePlay() { playing ? stopPlay() : play(); }

/* =========================================================================
   WIRING UP THE UI
   ========================================================================= */
document.getElementById("playBtn").addEventListener("click", togglePlay);
document.getElementById("resetBtn").addEventListener("click", () => {
  graph = defaultGraph();
  for (const n of graph.nodes) if (n.state) n._initState = { ...n.state };
  selectedId = null; playhead = 0;
  rebuild(); recompute(); renderInspector();
});
document.getElementById("hoursSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-hours]"); if (!b) return;
  document.querySelectorAll("#hoursSeg button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  hours = parseInt(b.dataset.hours, 10);
  playhead = 0; recompute();
});
document.querySelector(".palette").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-add]"); if (!b) return;
  addNode(b.dataset.add);
});
scrub.addEventListener("input", () => {
  if (playing) stopPlay();
  playhead = parseInt(scrub.value, 10);
  drawChart(); refreshReadouts();
});
document.addEventListener("keydown", (e) => {
  if (e.key === " " && e.target === document.body) { e.preventDefault(); togglePlay(); }
  if ((e.key === "Delete" || e.key === "Backspace") && selectedId && document.activeElement === document.body) deleteNode(selectedId);
});
window.addEventListener("resize", () => { drawChart(); });

/* boot */
graph = defaultGraph();
for (const n of graph.nodes) if (n.state) n._initState = { ...n.state };
rebuild();
recompute();
playhead = trace.t.length - 1; // open on the fully-simulated day
refreshReadouts();
drawChart();
</script>
