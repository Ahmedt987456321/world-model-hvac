<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AHU · 3D proof</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #11161c; overflow: hidden;
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    background: rgba(18,24,32,0.72); color: #e7eef5; backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 14px;
    max-width: 260px;
  }
  .panel h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .panel p { margin: 0 0 10px; font-size: 12px; color: #9fb0c0; line-height: 1.5; }
  .row { display: flex; gap: 6px; }
  .row button {
    flex: 1; font: inherit; font-size: 12px; color: #e7eef5; cursor: pointer;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; padding: 6px 8px;
  }
  .row button.on { background: rgba(79,214,227,0.18); border-color: #3fd0dd; color: #7fe6f0; }
  .hint { position: fixed; left: 16px; bottom: 14px; z-index: 10; font-size: 11px;
    color: #8496a6; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .tag { position: fixed; right: 16px; bottom: 14px; z-index: 10; font-size: 11px;
    color: #6a7d8f; font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="panel">
  <h1>Air handler — 3D</h1>
  <p>A real-time 3D model (metal, lighting, shadows, reflections). Drag to orbit, scroll to zoom.</p>
  <div class="row">
    <button id="btnHeat" class="on">Heating</button>
    <button id="btnCool">Cooling</button>
    <button id="btnFan" class="on">Fan: on</button>
  </div>
</div>
<div class="hint">drag to orbit · scroll to zoom</div>
<div class="tag">world-model-hvac · proof</div>

<script src="./three.min.js"></script>
<script>
"use strict";
const { Scene, PerspectiveCamera, WebGLRenderer, Group, Mesh, Color, Vector3,
  BoxGeometry, CylinderGeometry, TorusGeometry, PlaneGeometry, SphereGeometry,
  MeshStandardMaterial, MeshBasicMaterial, ShadowMaterial,
  DirectionalLight, HemisphereLight, AmbientLight,
  PMREMGenerator, PCFSoftShadowMap, ACESFilmicToneMapping, SRGBColorSpace,
  MathUtils } = THREE;

const stage = document.getElementById("stage");
const renderer = new WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = PCFSoftShadowMap;
renderer.toneMapping = ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new Scene();
scene.background = new Color(0x11161c);

const camera = new PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);

/* ---- a small studio environment so the metal has something to reflect ---- */
function studioEnv() {
  const pmrem = new PMREMGenerator(renderer);
  const env = new Scene();
  env.background = new Color(0x2a3038);
  const light = (hex, x, y, z, sx, sy, sz) => {
    const m = new Mesh(new BoxGeometry(sx, sy, sz), new MeshBasicMaterial({ color: hex }));
    m.position.set(x, y, z); env.add(m);
  };
  light(0xffffff, 0, 12, 0, 14, 0.2, 14);   // soft top
  light(0xbcd2ff, -10, 4, 5, 0.2, 9, 12);   // cool key
  light(0xffe4c0, 9, 3, -6, 0.2, 8, 12);    // warm fill
  light(0x8a96a4, 0, 2, 12, 16, 8, 0.2);    // front bounce
  const tex = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();
  return tex;
}
scene.environment = studioEnv();

/* ---- lights ---- */
scene.add(new HemisphereLight(0xdfe8f2, 0x2a2f36, 0.55));
scene.add(new AmbientLight(0xffffff, 0.12));
const key = new DirectionalLight(0xffffff, 2.4);
key.position.set(7, 12, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 60;
key.shadow.camera.left = -14; key.shadow.camera.right = 14;
key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
key.shadow.bias = -0.0003;
scene.add(key);
const rim = new DirectionalLight(0x9fc0ff, 0.6);
rim.position.set(-8, 6, -8);
scene.add(rim);

/* ---- materials ---- */
const steel = new MeshStandardMaterial({ color: 0xb7c0c9, metalness: 0.92, roughness: 0.34 });
const steelDark = new MeshStandardMaterial({ color: 0x8b95a0, metalness: 0.9, roughness: 0.42 });
const galv = new MeshStandardMaterial({ color: 0xc3c9cf, metalness: 0.86, roughness: 0.5 });
const trim = new MeshStandardMaterial({ color: 0x333a42, metalness: 0.5, roughness: 0.55 });
const coilMat = new MeshStandardMaterial({ color: 0x9aa3ac, metalness: 0.7, roughness: 0.4,
  emissive: new Color(0xe0662a), emissiveIntensity: 0.55 });

const add = (geo, mat, parent, x = 0, y = 0, z = 0) => {
  const m = new Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; (parent || scene).add(m); return m;
};

/* ---- the AHU ---- */
const ahu = new Group();
scene.add(ahu);
const BODY_Y = 3.4;

// main casing
const casing = add(new BoxGeometry(4.6, 2.0, 2.0), steel, ahu, 0, BODY_Y, 0);
// panel seams (thin recessed frames on the front face)
for (const sx of [-1.5, -0.4, 0.7]) {
  add(new BoxGeometry(0.03, 1.8, 0.02), steelDark, ahu, sx, BODY_Y, 1.01);
}
// top lifting lugs
for (const sx of [-1.8, 1.8]) add(new BoxGeometry(0.12, 0.12, 0.5), steelDark, ahu, sx, BODY_Y + 1.06, 0);
// base rails
for (const sz of [-0.8, 0.8]) add(new BoxGeometry(4.7, 0.14, 0.16), trim, ahu, 0, BODY_Y - 1.02, sz);

// intake hood (angled box on the -x end) + louvers
const hood = add(new BoxGeometry(0.7, 1.7, 1.7), steel, ahu, -2.6, BODY_Y, 0);
hood.rotation.z = 0.12;
for (let i = -3; i <= 3; i++)
  add(new BoxGeometry(0.06, 0.12, 1.5), trim, ahu, -2.95, BODY_Y + i * 0.22, 0).rotation.z = 0.5;

// control panel on the front
add(new BoxGeometry(0.5, 0.7, 0.06), trim, ahu, 1.6, BODY_Y - 0.1, 1.02);

// fan on the +x end (recessed ring + hub + blades)
const fanHub = new Group(); fanHub.position.set(2.32, BODY_Y, 0); ahu.add(fanHub);
add(new TorusGeometry(0.66, 0.12, 16, 40), steelDark, fanHub).rotation.y = Math.PI / 2;
add(new CylinderGeometry(0.55, 0.55, 0.14, 36), steelDark, fanHub).rotation.z = Math.PI / 2;
const blades = new Group(); fanHub.add(blades);
add(new CylinderGeometry(0.12, 0.12, 0.22, 20), steel, blades).rotation.z = Math.PI / 2;
for (let i = 0; i < 9; i++) {
  const b = add(new BoxGeometry(0.06, 0.5, 0.16), steel, blades, 0.06, 0, 0);
  b.position.y = Math.cos((i / 9) * Math.PI * 2) * 0.3;
  b.position.z = Math.sin((i / 9) * Math.PI * 2) * 0.3;
  b.rotation.x = (i / 9) * Math.PI * 2;
  b.rotation.z = 0.5;
}

// coil bank hint (visible through a framed opening on the front)
add(new BoxGeometry(0.9, 1.5, 0.05), coilMat, ahu, -0.4, BODY_Y, 1.0);
add(new BoxGeometry(1.0, 1.6, 0.04), trim, ahu, -0.4, BODY_Y, 1.0);

/* ---- galvanized duct manifolds dropping to the floor ---- */
function ductManifold(cx) {
  const g = new Group(); ahu.add(g);
  const headerY = BODY_Y - 1.15;
  // horizontal header under the casing
  const header = add(new CylinderGeometry(0.28, 0.28, 2.0, 28), galv, g, cx, headerY, 0);
  header.rotation.x = Math.PI / 2;
  // riser connecting casing to header
  add(new CylinderGeometry(0.26, 0.26, 0.35, 24), galv, g, cx, headerY + 0.35, 0);
  // three vertical drops with flared feet
  for (const dz of [-0.7, 0, 0.7]) {
    const dropTop = headerY;
    const dropLen = dropTop - 0.55;
    add(new CylinderGeometry(0.22, 0.22, dropLen, 24), galv, g, cx, dropTop - dropLen / 2, dz);
    // elbow
    add(new TorusGeometry(0.22, 0.22, 12, 20, Math.PI / 2), galv, g, cx, 0.6, dz);
    // flared foot
    add(new CylinderGeometry(0.34, 0.22, 0.3, 24), galv, g, cx, 0.2, dz);
    add(new CylinderGeometry(0.36, 0.36, 0.05, 24), steelDark, g, cx, 0.05, dz);
  }
  return g;
}
ductManifold(-1.4);
ductManifold(1.4);

/* ---- ground ---- */
const ground = new Mesh(new PlaneGeometry(80, 80), new ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const floor = new Mesh(new PlaneGeometry(80, 80),
  new MeshStandardMaterial({ color: 0x161c23, metalness: 0.1, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.001; floor.receiveShadow = true; scene.add(floor);

/* ---- simple orbit control ---- */
let az = 0.85, pol = 1.15, rad = 13;
const target = new Vector3(0, 2.6, 0);
function updateCam() {
  camera.position.set(
    target.x + rad * Math.sin(pol) * Math.sin(az),
    target.y + rad * Math.cos(pol),
    target.z + rad * Math.sin(pol) * Math.cos(az));
  camera.lookAt(target);
}
let dragging = false, px = 0, py = 0;
renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => (dragging = false));
addEventListener("pointermove", (e) => {
  if (!dragging) return;
  az -= (e.clientX - px) * 0.006; px = e.clientX;
  pol = MathUtils.clamp(pol - (e.clientY - py) * 0.006, 0.25, 1.45); py = e.clientY;
  updateCam();
});
renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  rad = MathUtils.clamp(rad * (1 + Math.sign(e.deltaY) * 0.08), 6, 26); updateCam();
}, { passive: false });

/* ---- controls ---- */
let fanOn = true;
const bHeat = document.getElementById("btnHeat"), bCool = document.getElementById("btnCool"), bFan = document.getElementById("btnFan");
bHeat.onclick = () => { coilMat.emissive.set(0xe0662a); bHeat.classList.add("on"); bCool.classList.remove("on"); };
bCool.onclick = () => { coilMat.emissive.set(0x2f7fd0); bCool.classList.add("on"); bHeat.classList.remove("on"); };
bFan.onclick = () => { fanOn = !fanOn; bFan.textContent = "Fan: " + (fanOn ? "on" : "off"); bFan.classList.toggle("on", fanOn); };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateCam();
let auto = 0;
function tick() {
  requestAnimationFrame(tick);
  if (fanOn) blades.rotation.x += 0.35;
  auto += 0.0015; az += 0.0006; updateCam(); // gentle idle drift
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
